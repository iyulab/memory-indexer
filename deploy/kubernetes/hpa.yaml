apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-indexer
  namespace: default
  labels:
    app: memory-indexer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memory-indexer
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  # Custom metrics (requires metrics-server)
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "100"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50  # Scale down maximum 50% at a time
        periodSeconds: 60
      - type: Pods
        value: 2  # Scale down maximum 2 pods at a time
        periodSeconds: 60
      selectPolicy: Min  # Use the policy that scales down the least

    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100  # Scale up maximum 100% at a time
        periodSeconds: 30
      - type: Pods
        value: 4  # Scale up maximum 4 pods at a time
        periodSeconds: 30
      selectPolicy: Max  # Use the policy that scales up the most
