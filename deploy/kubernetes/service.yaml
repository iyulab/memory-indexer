apiVersion: v1
kind: Service
metadata:
  name: memory-indexer
  namespace: default
  labels:
    app: memory-indexer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For AWS EKS
spec:
  type: ClusterIP
  selector:
    app: memory-indexer
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: health
    port: 8081
    targetPort: health
    protocol: TCP
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: memory-indexer-headless
  namespace: default
  labels:
    app: memory-indexer
spec:
  clusterIP: None
  selector:
    app: memory-indexer
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
