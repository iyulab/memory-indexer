version: '3.8'

services:
  # Memory Indexer MCP Server
  memory-indexer:
    image: memory-indexer:0.3.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: memory-indexer
    restart: unless-stopped
    ports:
      - "8080:8080"  # Main HTTP port
      - "8081:8081"  # Health check port
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      # Storage configuration
      - MemoryIndexer__Storage__Type=Qdrant
      - MemoryIndexer__Storage__ConnectionString=http://qdrant:6334

      # Embedding configuration
      - MemoryIndexer__Embedding__Provider=Ollama
      - MemoryIndexer__Embedding__Model=bge-m3
      - MemoryIndexer__Embedding__Dimensions=1024
      - MemoryIndexer__Embedding__BaseUrl=http://ollama:11434

      # VCM configuration
      - MemoryIndexer__VCM__WorkingMemory__Capacity=7
      - MemoryIndexer__VCM__WorkingMemory__DefaultTtl=00:10:00
      - MemoryIndexer__VCM__WorkingMemory__LazyEmbeddingLoading=true

      - MemoryIndexer__VCM__RecentlyBuffer__MaxIdleSeconds=60
      - MemoryIndexer__VCM__RecentlyBuffer__TokenThreshold=500
      - MemoryIndexer__VCM__RecentlyBuffer__TurnThreshold=3

      # Logging
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__MemoryIndexer=Debug

    volumes:
      - memory-data:/app/data
      - memory-logs:/app/logs

    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - memory-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - memory-network

  # Ollama for Local Embeddings
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - memory-network
    # GPU support (uncomment for NVIDIA GPUs)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Ollama Model Puller (runs once to download bge-m3)
  ollama-puller:
    image: ollama/ollama:latest
    container_name: ollama-puller
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        ollama pull bge-m3
        echo "Model bge-m3 downloaded successfully"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - memory-network
    restart: "no"

volumes:
  memory-data:
    driver: local
  memory-logs:
    driver: local
  qdrant-data:
    driver: local
  ollama-data:
    driver: local

networks:
  memory-network:
    driver: bridge
