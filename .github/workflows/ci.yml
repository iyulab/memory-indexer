name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Core Tests
      run: dotnet test tests/MemoryIndexer.Tests --no-build --configuration Release --verbosity normal --blame-hang --blame-hang-timeout 5m

    # No continue-on-error: a failing SDK test fails this job, exactly as the core suite above.
    # The step carried `continue-on-error: true` from the commit that introduced this workflow,
    # which made SDK failures invisible in a green run. The category filter already excludes the
    # tests that need a local model, a GPU host, or heavy fixtures, so what remains has no reason
    # to be treated as advisory — measured at 2056 passed / 0 failed under this exact filter.
    - name: Run SDK Tests (excluding LocalModel and Heavy)
      run: |
        dotnet test tests/MemoryIndexer.Sdk.Tests \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "Category!=LocalModel&Category!=Heavy&Category!=GpuStack" \
          --blame-hang --blame-hang-timeout 5m
