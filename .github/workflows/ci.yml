name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Core Tests
      run: dotnet test tests/MemoryIndexer.Tests --no-build --configuration Release --verbosity normal

    - name: Run SDK Tests (excluding LocalModel and Heavy)
      run: |
        dotnet test tests/MemoryIndexer.Sdk.Tests \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "Category!=LocalModel&Category!=Heavy&Category!=GpuStack"
      continue-on-error: true
