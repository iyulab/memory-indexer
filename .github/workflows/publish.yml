name: Publish NuGet Package

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish even if version unchanged'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Extract Version from Directory.Build.props
      id: version
      run: |
        VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Check if version exists on NuGet.org
      id: version_check
      run: |
        VERSION=${{ steps.version.outputs.version }}
        # Check if this version already exists on NuGet.org
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/memoryindexer/${VERSION}/memoryindexer.${VERSION}.nupkg")
        if [ "$HTTP_STATUS" = "200" ]; then
          echo "Version $VERSION already exists on NuGet.org"
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "Version $VERSION not found on NuGet.org (HTTP $HTTP_STATUS) - will publish"
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run CI-safe Tests
      run: |
        dotnet test tests/MemoryIndexer.Tests --no-build --configuration Release --verbosity minimal
        dotnet test tests/MemoryIndexer.Sdk.Tests --no-build --configuration Release --verbosity minimal --filter "Category!=LocalModel&Category!=Heavy&Category!=GpuStack"

    - name: Pack Packages
      if: steps.version_check.outputs.changed == 'true' || github.event.inputs.force_publish == 'true'
      run: |
        dotnet pack src/MemoryIndexer/MemoryIndexer.csproj \
          --no-build \
          --configuration Release \
          --output ./packages
        dotnet pack src/MemoryIndexer.Sdk/MemoryIndexer.Sdk.csproj \
          --no-build \
          --configuration Release \
          --output ./packages
        echo "Packages created:"
        ls -la ./packages/

    - name: Push to NuGet.org
      if: (steps.version_check.outputs.changed == 'true' || github.event.inputs.force_publish == 'true') && github.ref == 'refs/heads/main'
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -z "$NUGET_API_KEY" ]; then
          echo "NUGET_API_KEY is not set. Skipping NuGet.org publish."
          exit 0
        fi
        dotnet nuget push ./packages/*.nupkg \
          --api-key $NUGET_API_KEY \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Summary
      run: |
        echo "## 📦 NuGet Package Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Version Changed:** ${{ steps.version_check.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Packages:**" >> $GITHUB_STEP_SUMMARY
        echo "- MemoryIndexer (Core)" >> $GITHUB_STEP_SUMMARY
        echo "- MemoryIndexer.Sdk (Full SDK)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.version_check.outputs.changed }}" == "true" ] || [ "${{ github.event.inputs.force_publish }}" == "true" ]; then
          echo "✅ Packages were built and published" >> $GITHUB_STEP_SUMMARY
        else
          echo "⏭️ Package build skipped (version unchanged)" >> $GITHUB_STEP_SUMMARY
        fi
